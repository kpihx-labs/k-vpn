[project]
name = "k-vpn"
version = "2.0.0"
description = "Linux OpenVPN relay selector with verified egress, measured throughput and XDG configuration."
readme = "README.md"
authors = [
    { name = "KpihX" }
]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.0.0",
    "urllib3>=2.8.0",
]

[project.scripts]
k-vpn = "k_vpn.main:app"

[project.urls]
Repository = "https://github.com/kpihx-labs/k-vpn"
GitLab = "https://gitlab.com/kpihx-labs/vpns/k-vpn"
Issues = "https://github.com/kpihx-labs/k-vpn/issues"
Changelog = "https://github.com/kpihx-labs/k-vpn/blob/master/CHANGELOG.md"

[build-system]
requires = [
    "uv_build>=0.9.21,<0.10.0",
]
build-backend = "uv_build"
